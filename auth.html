<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levelling - Hunter Authentication</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="particles-container">
        <div id="particles"></div>
    </div>

    <div class="container">
        <div id="intro-popup" class="intro-popup">
            <div class="intro-content">
                <h1>HELLO, STRANGER...</h1>
                <p>The System has detected your presence. Identify yourself to access the Levelling Gates.</p>
                <button id="accept-quest" class="btn-primary">ACCEPT QUEST</button>
            </div>
        </div>

        <div id="auth-container" class="auth-container hidden">
            <div class="logo">LEVELLING</div>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="login">ACCESS GATE</button>
                <button class="tab-btn" data-tab="signup">REGISTER AS HUNTER</button>
            </div>
            
            <div class="tab-content">
                <!-- Login Form -->
                <div id="login-form" class="form-container active">
                    <div class="system-prompt">SYSTEM: ENTER YOUR CREDENTIALS</div>
                    
                    <div class="input-group">
                        <label for="login-email">PLAYER ID (EMAIL)</label>
                        <input type="email" id="login-email" class="hud-input" placeholder="Enter your email">
                    </div>
                    
                    <div class="input-group">
                        <label for="login-password">GATE PASSWORD</label>
                        <input type="password" id="login-password" class="hud-input" placeholder="Enter your password">
                        <div class="password-toggle">
                            <i class="fas fa-eye"></i>
                        </div>
                    </div>
                    
                    <div class="forgot-password">
                        <a href="#" id="reset-password">RECOVER MANA (Reset Password)</a>
                    </div>
                    
                    <div class="error-message" id="login-error"></div>
                    
                    <button id="login-btn" class="btn-primary">ACCESS GATE</button>
                    
                    <div class="divider">
                        <span>OR ACCESS VIA GUILD</span>
                    </div>
                    
                    <div class="social-logins">
                        <button id="google-login" class="btn-social">
                            <i class="fab fa-google"></i> GOOGLE GUILD
                        </button>
                    </div>
                </div>
                
                <!-- Signup Form -->
                <div id="signup-form" class="form-container">
                    <div class="system-prompt">SYSTEM: REGISTER NEW HUNTER</div>
                    
                    <div class="input-group">
                        <label for="signup-email">PLAYER ID (EMAIL)</label>
                        <input type="email" id="signup-email" class="hud-input" placeholder="Enter your email">
                    </div>
                    
                    <div class="input-group">
                        <label for="signup-password">CREATE PASSWORD</label>
                        <input type="password" id="signup-password" class="hud-input" placeholder="Create a password">
                        <div class="password-toggle">
                            <i class="fas fa-eye"></i>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" class="hud-input" placeholder="Confirm your password">
                    </div>
                    
                    <div class="input-group">
                        <label for="hunter-rank">INITIAL HUNTER RANK</label>
                        <select id="hunter-rank" class="hud-input">
                            <option value="E">E-RANK (Beginner)</option>
                            <option value="D">D-RANK (Novice)</option>
                            <option value="C">C-RANK (Intermediate)</option>
                            <option value="B">B-RANK (Advanced)</option>
                            <option value="A">A-RANK (Expert)</option>
                            <option value="S">S-RANK (Master)</option>
                        </select>
                    </div>
                    
                    <div class="error-message" id="signup-error"></div>
                    
                    <button id="signup-btn" class="btn-primary">REGISTER AS HUNTER</button>
                    
                    <div class="divider">
                        <span>OR REGISTER VIA GUILD</span>
                    </div>
                    
                    <div class="social-logins">
                        <button id="google-signup" class="btn-social">
                            <i class="fab fa-google"></i> GOOGLE GUILD
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <div class="toast-content">
            <i class="fas fa-check-circle"></i>
            <div class="toast-message">Dungeon Access Granted</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Auth JS -->
    <script src="auth.js"></script>
</body>
</html>
